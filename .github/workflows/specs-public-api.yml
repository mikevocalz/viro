name: Specs public API

on:
  push:
    branches:
      - main
      - develop
      - "feat/specs-*"
    paths:
      - "components/Specs/**"
      - "components/Animation/ViroAnimations.ts"
      - "examples/specs-platform-lab/**"
      - "__test__/ViroSpecs*.test.ts"
      - "__test__/ViroSpecs*.test.tsx"
      - "__test__/fixtures/specs/**"
      - "schemas/**"
      - "tsconfig.specs-cli.json"
      - "src/specs-cli/**"
      - "scripts/jest-specs-asset-transform.cjs"
      - "docs/specs*.md"
      - "bin/viro-specs.cjs"
      - "bin/viro-specs-compile.cjs"
      - "scripts/test-viro-specs-compiler.cjs"
      - "scripts/jest-specs-react-native.cjs"
      - "jest.specs.config.cjs"
      - "babel.specs.config.cjs"
      - "index.ts"
      - "package.json"
      - ".github/workflows/specs-public-api.yml"
      - "web-harness/specs-preview/**"
  pull_request:
    paths:
      - "components/Specs/**"
      - "components/Animation/ViroAnimations.ts"
      - "examples/specs-platform-lab/**"
      - "__test__/ViroSpecs*.test.ts"
      - "__test__/ViroSpecs*.test.tsx"
      - "__test__/fixtures/specs/**"
      - "schemas/**"
      - "tsconfig.specs-cli.json"
      - "src/specs-cli/**"
      - "scripts/jest-specs-asset-transform.cjs"
      - "docs/specs*.md"
      - "bin/viro-specs.cjs"
      - "bin/viro-specs-compile.cjs"
      - "scripts/test-viro-specs-compiler.cjs"
      - "jest.specs.config.cjs"
      - "babel.specs.config.cjs"
      - "index.ts"
      - "package.json"
      - ".github/workflows/specs-public-api.yml"
      - "web-harness/specs-preview/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Typecheck (--strict)
        run: npx tsc --noEmit --strict
      - name: Build and type-check the Specs CLI with the shared core (strict)
        run: npm run build:specs-cli
      - name: Specs suites (goldens, runtime/static byte identity, Platform Lab timing, schema, scene gates)
        run: npm run test:specs
      - name: Static Specs compiler regression
        run: npm run test:specs-compiler
      - name: CLI syntax
        run: |
          node --check bin/viro-specs.cjs
          node --check bin/viro-specs-compile.cjs

  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-harness/specs-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-harness/specs-preview/package-lock.json
      - name: Install the preview package
        run: npm ci --no-audit --no-fund
      - name: Vendored Lens core matches VENDOR.json
        run: npm run vendor:check
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Parity with the viro-external mock host, Lens constants, animation
        run: npm test
      - name: Headless screenshots (installed Chrome)
        run: node scripts/screenshot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specs-preview-screenshots
          path: web-harness/specs-preview/screenshots/
