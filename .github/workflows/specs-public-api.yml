name: Specs public API

on:
  push:
    branches:
      - main
      - develop
      - "feat/specs-*"
    paths:
      - "components/Specs/**"
      - "components/Animation/ViroAnimations.ts"
      - "examples/specs-platform-lab/**"
      - "__test__/ViroSpecs*.test.ts"
      - "__test__/ViroSpecs*.test.tsx"
      - "__test__/fixtures/specs/**"
      - "schemas/**"
      - "tsconfig.specs-core.json"
      - "docs/specs*.md"
      - "bin/viro-specs.cjs"
      - "bin/viro-specs-compile.cjs"
      - "scripts/test-viro-specs-compiler.cjs"
      - "scripts/jest-specs-react-native.cjs"
      - "jest.specs.config.cjs"
      - "babel.specs.config.cjs"
      - "index.ts"
      - "package.json"
      - ".github/workflows/specs-public-api.yml"
  pull_request:
    paths:
      - "components/Specs/**"
      - "components/Animation/ViroAnimations.ts"
      - "examples/specs-platform-lab/**"
      - "__test__/ViroSpecs*.test.ts"
      - "__test__/ViroSpecs*.test.tsx"
      - "__test__/fixtures/specs/**"
      - "schemas/**"
      - "tsconfig.specs-core.json"
      - "docs/specs*.md"
      - "bin/viro-specs.cjs"
      - "bin/viro-specs-compile.cjs"
      - "scripts/test-viro-specs-compiler.cjs"
      - "jest.specs.config.cjs"
      - "babel.specs.config.cjs"
      - "index.ts"
      - "package.json"
      - ".github/workflows/specs-public-api.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Typecheck (--strict)
        run: npx tsc --noEmit --strict
      - name: Build Specs core for the CLI
        run: npm run build:specs-core
      - name: Specs suites (runtime compiler, manifest schema over every fixture, scene gates)
        run: npm run test:specs
      - name: Static Specs compiler regression
        run: npm run test:specs-compiler
      - name: CLI syntax
        run: |
          node --check bin/viro-specs.cjs
          node --check bin/viro-specs-compile.cjs
