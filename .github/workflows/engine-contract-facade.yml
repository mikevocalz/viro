name: Engine contract facade

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "components/Engine/**"
      - "__test__/engineContract.test.ts"
      - "docs/architecture/ENGINE-CONTRACT-BRIDGE.md"
      - ".github/workflows/engine-contract-facade.yml"

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run engine-contract unit tests
        run: npm test -- --runInBand __test__/engineContract.test.ts

      - name: Type-check package
        run: npm run tsc
