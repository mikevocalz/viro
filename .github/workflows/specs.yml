name: Viro SPECS integration

on:
  pull_request:
    paths:
      - "components/Spatial/ViroXRRuntime.ts"
      - "components/Spatial/ViroSpecs*.ts"
      - "components/Animation/ViroAnimations.ts"
      - "__test__/ViroSpecs*"
      - "examples/specs/**"
      - "docs/specs-*.md"
      - "bin/viro.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/specs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: SPECS Jest regressions
        run: |
          tests=()
          test -f __test__/ViroSpecsJSXCompiler.test.tsx && tests+=(__test__/ViroSpecsJSXCompiler.test.tsx)
          test -f __test__/ViroSpecsRuntimeBridge.test.ts && tests+=(__test__/ViroSpecsRuntimeBridge.test.ts)
          if [ "${#tests[@]}" -gt 0 ]; then
            npm test -- --runInBand --runTestsByPath "${tests[@]}"
          else
            echo "No SPECS Jest layer in this stack level yet."
          fi

      - name: Build TypeScript and declarations
        run: npm run build

      - name: Verify public SPECS surface
        run: |
          grep -q 'getXRRuntime' dist/index.js
          if test -f components/Spatial/ViroSpecsJSXCompiler.ts; then
            grep -q 'compileViroSpecsJSX' dist/index.js
          fi
          if test -f components/Spatial/ViroSpecsRuntimeBridge.ts; then
            grep -q 'mountViroSpecsCompilation' dist/index.js
          fi

      - name: Pack smoke test
        run: npm pack --dry-run
