apply plugin: 'com.android.library'
// This handwritten bridge has no codegen specs. Applying the React plugin here
// generates and bundles duplicate React Native core classes.

// Check if the new architecture is enabled
def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    namespace "com.viromedia.bridge"

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Add build config for New Architecture detection
        buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString())

        // viro_renderer declares flavor dimension 'device' (mobile/pico/quest).
        // viro_bridge is flavor-agnostic — pick pico as the default resolution.
        missingDimensionStrategy 'device', 'pico'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Registry tests construct android.view.Surface and call android.util.Log on the JVM.
    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // Add C++ build for JSI bridge - Enable when CMake is available
    // To enable JSI bridge compilation, uncomment the following block:
    /*
    if (isNewArchitectureEnabled()) {
        externalNativeBuild {
            cmake {
                path "src/main/cpp/CMakeLists.txt"
                version "3.13.0"
            }
        }

        defaultConfig {
            externalNativeBuild {
                cmake {
                    cppFlags "-std=c++17", "-fexceptions", "-frtti", "-DWITH_INSPECTOR=1"
                    abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
                    arguments "-DANDROID_STL=c++_shared",
                              "-DREACT_NATIVE_DIR=${rootProject.projectDir}/../node_modules/react-native",
                              "-DNODE_MODULES_DIR=${rootProject.projectDir}/../node_modules"
                }
            }
        }
    }
    */
}

// Resolve the installed react-native version from node_modules so this library
// compiles against whatever version the host app (or local dev) has installed.
def reactNativeVersion = new groovy.json.JsonSlurper()
    .parseText(new File("${rootProject.projectDir}/../node_modules/react-native/package.json").text)
    .version

dependencies {
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    compileOnly("com.facebook.react:react-android:${reactNativeVersion}")

    implementation 'androidx.appcompat:appcompat:1.0.0'
    testImplementation 'junit:junit:4.12'
    implementation 'com.google.ar:core:1.43.0'
    // Required for ARCore Geospatial API
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation project(':gvr_common')
    implementation project(':viro_renderer')
    // The renderer AAR is opaque to javac (its classes live inside a nested
    // classes.jar), so the bridge compiles against the extracted main-branch
    // jar — the same renderer surface the shipped bridge AAR was built
    // against. Bridge code paths that reach main-only symbols (cloud anchors,
    // scan callbacks) stay inert on the Pico renderer.
    compileOnly files('../viro_renderer/main-classes/viro-renderer-main-classes.jar')
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.protobuf.nano:protobuf-javanano:3.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    // VPS scan uploads. Also declared in react_viro/build.gradle, which ships this module's AAR to apps.
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation "com.facebook.fresco:fresco:3.1.3"
    implementation "com.facebook.fresco:imagepipeline:3.1.3"
    implementation "com.facebook.fresco:imagepipeline-okhttp3:3.1.3"
    implementation 'com.facebook.fresco:imagepipeline-native:3.1.3'
    implementation 'com.facebook.fresco:memory-type-ashmem:3.1.3'
    implementation "com.facebook.fresco:ui-common:3.1.3"
    implementation "com.facebook.fresco:middleware:3.1.3"
    implementation "com.facebook.fresco:animated-gif:3.1.3"
    implementation 'com.facebook.soloader:nativeloader:0.10.5'
    implementation 'com.facebook.fresco:fbcore:3.1.3'
    implementation 'com.facebook.fresco:drawee:3.1.3'
    implementation 'com.facebook.fresco:memory-type-native:3.1.3'
    implementation 'com.facebook.fresco:memory-type-java:3.1.3'
    implementation 'com.facebook.fresco:nativeimagefilters:3.1.3'
    implementation 'com.facebook.fresco:nativeimagetranscoder:3.1.3'
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // ONNX Runtime is NOT bundled here on purpose: inference is delegated entirely to the
    // @reactvision/react-viro-onnx provider (it carries its own onnxruntime-android). Without
    // that package the detector does nothing — there is no built-in fallback (mirrors iOS).

    // CameraX para captura de frames + PreviewView (vista previa en modo standalone)
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"
}
