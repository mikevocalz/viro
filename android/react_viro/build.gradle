apply plugin: 'com.android.library'

android {
    compileSdk rootProject.ext.compileSdkVersion
    namespace 'com.viromedia.bridge.shim.reactviro'

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
    }

    flavorDimensions += "device"
    productFlavors {
        mobile { dimension "device" }
        pico   { dimension "device" }
        quest  { dimension "device" }
    }
}

dependencies {
    api files('react_viro-release.aar')
}

// Same AGP 8.12+ bundleAar guard as viro_renderer — see that build.gradle.
afterEvaluate {
    tasks.matching {
        it.name.startsWith('bundle') && it.name.endsWith('Aar')
    }.configureEach { enabled = false }
}
