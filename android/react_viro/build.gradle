apply plugin: 'com.android.library'

android {
    compileSdk rootProject.ext.compileSdkVersion
    namespace 'com.viromedia.bridge.shim.reactviro'

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
    }

    flavorDimensions += "device"
    productFlavors {
        mobile { dimension "device" }
        pico   { dimension "device" }
        quest  { dimension "device" }
        androidxr { dimension "device" }
    }
}

dependencies {
    api files('react_viro-release.aar')
    // A local AAR brings none of its dependencies, so an app gets the bridge's from here.
    // Keep in step with viro_bridge/build.gradle.
    api 'androidx.work:work-runtime:2.9.1'
}

// Same AGP 8.12+ bundleAar guard as viro_renderer — see that build.gradle.
afterEvaluate {
    tasks.matching {
        it.name.startsWith('bundle') && it.name.endsWith('Aar') && !it.name.endsWith('LocalLintAar')
    }.configureEach { enabled = false }
}
